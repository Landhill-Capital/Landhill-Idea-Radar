[project]
name = "idea-radar"
version = "0.1.0"
description = "Landhill Idea Radar - weekly business-idea signal scanner"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Landhill Capital" }]
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "click>=8.1",
    "feedparser>=6.0",
    "jinja2>=3.1",
]

[project.scripts]
idea-radar = "idea_radar.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
